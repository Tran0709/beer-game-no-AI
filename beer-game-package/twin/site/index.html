const HOW_TO_PLAY_CAPTIONS_VTT = "WEBVTT\n\n00:00:03.450 --> 00:00:09.080 size:92%\n<b>STEP 1 · THE CHAIN</b>\nOrders travel up the chain and beer ships back down, taking 2 weeks. You only see your own numbers.\n\n00:00:09.280 --> 00:00:14.620 size:92%\n<b>STEP 2 · START</b>\nPlay Solo against AI teammates, or host a Multiplayer room. Pick a role, game length and Market Scenario.\n\n00:00:14.820 --> 00:00:20.160 size:92%\n<b>STEP 3 · YOUR TURN</b>\nFrom week 3 you decide. This box shows what your customer ordered this week, the moment they submit.\n\n00:00:20.360 --> 00:00:26.270 size:92%\n<b>STEP 3 · YOUR TURN</b>\nNews adds or subtracts units from your order. Global hits everyone, Local only you; the total is added for you.\n\n00:00:26.470 --> 00:00:31.240 size:92%\n<b>STEP 3 · YOUR TURN</b>\nOrder from your upstream neighbour. It arrives in 2 weeks. Running short triggers a backlog alert.\n\n00:00:31.440 --> 00:00:35.350 size:92%\n<b>STEP 4 · TAKE TURNS</b>\nIn multiplayer everyone submits in order. Your turn opens when your customer submits.\n\n00:00:35.550 --> 00:00:40.890 size:92%\n<b>STEP 5 · THE FACILITATOR</b>\nThe Facilitator sets demand and news, and sees each order the moment it is placed. Nobody else does.\n\n00:00:41.090 --> 00:00:46.430 size:92%\n<b>STEP 6 · INTERVENTIONS</b>\nStuck role? Share the Retailer's data, cap its orders, or shift its costs. Players are told on screen.\n\n00:00:46.630 --> 00:00:50.540 size:92%\n<b>STEP 6 · INTERVENTIONS</b>\nHere the Wholesaler is shown the Retailer's real stock, backlog and customer demand.\n\n00:00:50.740 --> 00:00:54.650 size:92%\n<b>STEP 7 · THE RESULTS</b>\nLowest total cost wins. The dashed baseline shows what the bullwhip effect cost.\n\n00:00:54.850 --> 00:00:57.950 size:92%\n<b>STEP 8 · HELP ANYTIME</b>\nReplay this guide any time: Settings, then Help &amp; Guide.\n";
function guideSection(title, body) { return `<div class="guide-section"><h4>${title}</h4><p>${body}</p></div>`; }
function guideRoleList() {
  const roles = [
    { icon: '🏪', name: 'Retailer', body: 'The seller closest to the customer, think of a corner shop. You feel real, sometimes-unpredictable consumer demand first-hand. Nobody else in the chain finds out about it until they see how you react to it.' },
    { icon: '🏬', name: 'Wholesaler', body: 'You supply retailers in bulk. You never see the actual end consumer, only the orders the Retailer places with you, which are already one step removed from real demand.' },
    { icon: '🚚', name: 'Distributor', body: 'You supply wholesalers across a wider region. You\u2019re two steps removed from the end consumer, reacting entirely to the order pattern passed up from the Wholesaler.' },
    { icon: '🏭', name: 'Manufacturer', body: 'You\u2019re the brewery itself, the source of supply. You\u2019re the furthest from the end consumer, which means you\u2019re also the most exposed to swings that have been amplified by everyone downstream of you.' },
    { icon: '🧑\u200d🍺', name: 'Facilitator', body: 'You sit outside the cost competition entirely. You decide how much beer people actually want each week: the real demand signal everything else in the chain is reacting to. In multiplayer, the other four roles on your team wait for you to submit before they can order.' },
  ];
  return `<div class="guide-role-list">${roles.map(r => `
    <div class="guide-role-row">
      <span class="guide-role-icon">${r.icon}</span>
      <div class="guide-role-text"><b>${r.name}</b><p>${r.body}</p></div>
    </div>`).join('')}</div>`;
}
function renderGuideContent() {
  return `
  ${guideSection("🎯 Objective", "Minimize your own total cost over the session. Each week you pay for every unit of stock you keep and, at a higher rate, for every unit you still owe (your backlog). The rates come from the Market Scenario and can shift with the news or a Facilitator cost change.")}
  ${guideSection("🔗 The Chain", "Four roles form a line: Retailer → Wholesaler → Distributor → Manufacturer. Each orders from the one upstream of it, and beer ships back down the line, taking 2 weeks to arrive. A fifth role, the Facilitator, plays the customers and sets the real demand. Any seat with nobody in it is played by AI.")}
  <div class="guide-section">
    <h4>👥 The Five Roles, Explained</h4>
    ${guideRoleList()}
  </div>
  ${guideSection("🙈 What You Can See", "You see your own stock, your own backlog, and the order your customer placed this week. Nobody else's numbers are visible, and costs stay private until the game ends. That is deliberate: it is what causes the bullwhip effect. The one exception is when the Facilitator chooses to share the Retailer's data (see Interventions).")}
  ${guideSection("📥 Your Incoming Order", "From week 3 the box labelled Order received this week shows what your customer ordered this week, as soon as they have submitted: the Retailer sees the consumer demand, the Wholesaler sees the Retailer's order, and so on. News adjustments are already included, so it is the number you really have to supply. Until your customer has submitted, the box says it is waiting for them.")}
  ${guideSection("📦 Weeks 1-2", "Every order is fixed at 4 units, consumer demand is 4, and news does not apply. This primes the pipeline before the real exercise begins. Your decisions start in week 3.")}
  ${guideSection("📰 News: Global and Local", "News adds or subtracts a fixed number of units on the orders placed that week, and never takes an order below 0. Global news applies to every role and to consumer demand, and can also change holding and stockout costs. Local news applies only to one role, on top of any Global news. Your news box shows both with a total, for example Total adjustment this week: +10 (Global +6, Local +4). The adjustment is added to whatever you submit, whether you typed it or an AI decided it. The Facilitator picks the news; with no Facilitator, it is picked at random every two weeks.")}
  ${guideSection("🚨 Stock and Backlog Alerts", "If you owe more orders than you can fill, a red Stockout banner appears, with a sound and a short vibration or screen shake, because backlog costs more than spare stock. An amber Overordering warning appears if you hold far more stock than demand needs. Sound can be muted from the Settings menu.")}
  ${guideSection("📊 Market Scenario and Timer", "Before you start, choose one of the four Market Scenario icons (Stable, Rising Costs, Supply Shock, or Efficient Chain) to read about it and adjust its settings; it also sets the session's holding and stockout costs. You can also set an optional decision timer (up to 5 minutes per week). If time runs out before you submit, that week resolves with an AI-assisted decision standing in for you, just for that turn. Enter 00:00 for no timer.")}
  ${guideSection("👥 Multiplayer: Rooms and Turn Order", "A room seats 5 people: the 4 chain roles plus one Facilitator. The host creates the room and shares its 5-letter code; everyone else chooses Join, enters the code and claims a seat. The host can see everyone's submission progress and move players between roles before kickoff. Each week roles then submit in a fixed order: Facilitator, Retailer, Wholesaler, Distributor, Manufacturer. You can only submit once everyone before you has, and your screen says who you are waiting for. AI seats never make you wait. All orders are applied together once the last role has submitted.")}
  ${guideSection("🎛️ Facilitator: Demand and News", "Each week the Facilitator sets the real consumer demand. Suggested fills in a number informed by the Market Scenario that already allows for any active Global news; edit it freely, it is a starting point, never a requirement. The Facilitator also picks the Global news and each role's Local news.")}
  ${guideSection("👁️ Facilitator: Current Role status", "Click any seat in Current Role status (the Full Chain View in a solo game) to follow that role: stock, backlog and cost history, view only. In multiplayer each seat also shows how many units that role has just ordered, the moment they submit, with any news adjustment or ceiling spelled out; seats still to act show last week's order. Only the Facilitator sees this, and you can never edit or submit on someone else's behalf.")}
  ${guideSection("🧰 Facilitator: Interventions", "When one role is stuck in a backlog spiral, for example a Retailer that understocks and then panic-orders, the Facilitator has three levers, all off until switched on. Players are told on their own screens when one applies to them. Information sharing shows the Retailer's stock, backlog and real customer demand to the Wholesaler or the whole chain, and AI seats in scope then order from real customer demand; it deliberately breaks the usual rule that you only see your own numbers. An order ceiling caps one role's weekly order for a number of weeks, counted from the current week and applied after any news adjustment. A market shift sets different stock and backlog costs for one role or all of them from the next week resolved; weeks already played are not recalculated. Careful: making backlog cheaper than stock makes running short the cheaper strategy.")}
  ${guideSection("🏆 Results: Baseline and Winning", "After the final week, whoever has the lowest total cost among the 4 supply-chain roles on their team wins. The results compare each role with a baseline: what it would have cost if every role had simply passed orders through unchanged. The gap between the two is the real cost of the bullwhip effect. If the Facilitator changed costs during the game, the results screen says the totals are not directly comparable.")}`;
}
function quitGame() {
  stopTimer();
  clearBotActivity();
  if (state.mode === 'multiplayer' && state.transport) {
    if (state.multiplayerRole === 'guest') releaseSeat();
    state.transport.close();
  }
  Object.assign(state, {
    screen: 'start', mode: null, localRole: null, localTeamIndex: null, multiplayerRole: null, transport: null,
    lobby: null, teams: null, game: null, pendingHostDecisions: {}, facilitatorDone: false, waitingForOthers: false,
    joinError: null, connectionError: null, isAdminHost: false, moveModeFrom: null, facilitatorFollowing: null, liveDrafts: {}, liveCursors: {}, lastClicks: {},
    settingsOpen: false,
  });
  render();
}
function canRestartFromSettings() {
  if (state.mode === 'solo') return !!state.lastSoloConfig;
  if (state.mode === 'multiplayer') return state.multiplayerRole === 'host' && !!state.teams;
  return false;
}
function restartFromSettings() {
  state.settingsOpen = false;
  if (state.mode === 'solo') { restartSolo(); return; }
  if (state.mode === 'multiplayer' && state.multiplayerRole === 'host') { startHostedGame(); return; }
}
function renderSettingsPanel() {
  const root = document.getElementById('settingsPanelRoot') || (() => {
    const d = document.createElement('div'); d.id = 'settingsPanelRoot'; document.body.appendChild(d); return d;
  })();
  const open = !!state.settingsOpen;
  const canRestart = canRestartFromSettings();
  root.innerHTML = `
    <button id="settingsGearBtn" class="settings-gear-btn" title="Settings">⚙️</button>
    ${open ? `
    <div class="settings-dropdown" id="settingsDropdown">
      <button class="settings-item" id="settingsSoundBtn">${state.soundMuted ? '🔇' : '🔊'} ${state.soundMuted ? 'Unmute Sound' : 'Mute Sound'}</button>
      <button class="settings-item" id="settingsHelpBtn">📖 Help &amp; Guide</button>
      <button class="settings-item" id="settingsRestartBtn" ${canRestart ? '' : 'disabled'}>🔄 Restart${canRestart ? '' : ' <span class="opt-tag">(no active game)</span>'}</button>
      <button class="settings-item settings-item-danger" id="settingsQuitBtn">🚪 Quit to Start</button>
      <div class="settings-version" title="If this line is missing, an older copy of the game is being served">Build ${BUILD_TAG}</div>
    </div>` : ''}`;
  document.getElementById('settingsGearBtn').addEventListener('click', (e) => { e.stopPropagation(); state.settingsOpen = !state.settingsOpen; render(); });
  if (open) {
    document.getElementById('settingsSoundBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleSound(); });
    document.getElementById('settingsHelpBtn').addEventListener('click', (e) => { e.stopPropagation(); state.settingsOpen = false; render(); showHelpModal(); });
    const restartBtn = document.getElementById('settingsRestartBtn');
    if (canRestart) restartBtn.addEventListener('click', (e) => { e.stopPropagation(); restartFromSettings(); });
    document.getElementById('settingsQuitBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.confirm('Quit to the start screen? Any progress in this game will be lost.')) quitGame();
    });
    setTimeout(() => {
      document.addEventListener('click', (e) => {
        if (!root.contains(e.target)) { state.settingsOpen = false; render(); }
      }, { once: true });
    }, 0);
  }
}
function showHelpModal() {
  const root = document.getElementById('helpModalRoot') || (() => {
    const d = document.createElement('div'); d.id = 'helpModalRoot'; document.body.appendChild(d); return d;
  })();
  root.innerHTML = `
  <div class="modal-overlay" id="helpOverlay">
    <div class="modal help-modal">
      <h2>🍺 How to Play: The Beer Game</h2>
      <div class="modal-section">
        <h4>Video Walkthrough <span class="opt-tag">about a minute, with captions; jump to any step</span></h4>
        <video class="guide-video" controls playsinline preload="metadata">
          <source src="data:video/mp4;base64,${HOW_TO_PLAY_VIDEO_BASE64}" type="video/mp4" />
          <track kind="captions" srclang="en" label="English" default src="data:text/vtt;charset=utf-8,${encodeURIComponent(HOW_TO_PLAY_CAPTIONS_VTT)}" />
          Your browser doesn't support embedded video. The written guide below covers the same steps.
        </video>
        <div class="guide-chapters">${HOW_TO_PLAY_CHAPTERS.map((ch, i) => `<button type="button" class="chapter-btn" data-t="${ch.t}">${i + 1}. ${ch.label}</button>`).join('')}</div>
      </div>
      <div class="modal-section guide-body">${renderGuideContent()}</div>
      <button class="btn-primary btn-block" id="closeHelpBtn">Close Guide</button>
    </div>
  </div>`;
  document.getElementById('closeHelpBtn').addEventListener('click', closeHelpModal);
  document.getElementById('helpOverlay').addEventListener('click', (e) => { if (e.target.id === 'helpOverlay') closeHelpModal(); });

  const chapterBtns = root.querySelectorAll('.chapter-btn');
  const guideVideo = root.querySelector('video.guide-video');
  chapterBtns.forEach(btn => btn.addEventListener('click', () => {
    if (!guideVideo) return;
    try { guideVideo.currentTime = Number(btn.dataset.t); } catch (e) { /* metadata not loaded yet */ }
    const started = guideVideo.play();
    if (started && started.catch) started.catch(() => {});
  }));
  if (guideVideo) guideVideo.addEventListener('timeupdate', () => {
    let current = null;
    chapterBtns.forEach(btn => { if (guideVideo.currentTime >= Number(btn.dataset.t) - 0.2) current = btn; });
    chapterBtns.forEach(btn => btn.classList.toggle('active', btn === current));
  });
}
function closeHelpModal() {
  const root = document.getElementById('helpModalRoot');
  if (root) root.innerHTML = '';
}

window.state = state;
window.render = render;
window.startSolo = startSolo;
window.hostRoom = hostRoom;
window.joinRoom = joinRoom;
window.claimSeat = claimSeat;
window.moveSeat = moveSeat;
window.startHostedGame = startHostedGame;
window.submitDecision = submitDecision;
window.resolveSessionWeek = resolveSessionWeek;
window.showHelpModal = showHelpModal;
document.addEventListener('DOMContentLoaded', render);
if (document.readyState !== 'loading') render();
