<body><div id="app"></div><div id="helpModalRoot"></div><script>// ===== The Beer Game (LA4): Core Simulation Engine =====
//
// This is the classic MIT/corporate-training "Beer Distribution Game" :
// a teaching exercise about the bullwhip effect. Core rules match the LA4
// spec: 5 roles in a linear chain, a 2-week delivery lead time at every
// stage, orders fixed at 4 units for the first 2 weeks. NOTE: the spec's
// "Rick does not drink more than 14 cans per week" tip is NOT enforced as a
// hard cap - that limit was deliberately removed on request, so a
// Facilitator can enter any demand they like. Season length and cost
// parameters are host-configurable
// (see DEFAULT_* constants below), so a room can flex them per session.
//
// DELIBERATE DESIGN CHOICE: HIDDEN INFORMATION: each role can only see its
// own stock/backlog/history and the order it just received from its
// immediate downstream neighbor. It cannot see any other role's numbers.
// This isn't a missing feature: the whole pedagogical point of this game is
// that isolated, locally-rational decisions made without visibility into the
// rest of the chain are what cause the bullwhip effect. Removing that
// constraint would remove the lesson.

const CHAIN = ['retailer', 'wholesaler', 'distributor', 'manufacturer'];
const UPSTREAM_OF = { retailer: 'wholesaler', wholesaler: 'distributor', distributor: 'manufacturer', manufacturer: 'factory' };

const ROLE_LABELS = {
  retailer: 'Retailer', wholesaler: 'Wholesaler', distributor: 'Distributor',
  manufacturer: 'Manufacturer', facilitator: 'Facilitator',
};

const DEFAULT_TOTAL_WEEKS = 8;
const STARTING_STOCK = 12;
const DEFAULT_HOLDING_COST = 1;   // $ per unit of stock remaining, per week
const DEFAULT_STOCKOUT_COST = 2;  // $ per unit of unfulfilled backlog, per week
const LEAD_TIME = 2;      // weeks for a shipment to arrive after being sent
const FIXED_ORDER_WEEKS = 2; // weeks 1-2: every role's own order is forced to FIXED_ORDER_QTY
const FIXED_ORDER_QTY = 4;
const MIN_TOTAL_WEEKS = 4, MAX_TOTAL_WEEKS = 52; // sane bounds for the host's "number of weeks" setting

function rand(min, max) { return min + Math.random() * (max - min); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function makeRoleState(role) {
  return {
    role,
    stock: STARTING_STOCK,
    backlog: 0,
    totalCost: 0,
    // pre-loaded pipeline: goods already in transit before the game starts,
    // matching the spec's starting "Supplier Delivery - 4 per week (for 2 weeks)"
    incomingShipments: [FIXED_ORDER_QTY, FIXED_ORDER_QTY],
    orderPlacedThisWeek: null,
    incomingOrderThisWeek: null,
    shippedThisWeek: null,
    history: [], // one entry per week: {week, stock, backlog, incomingOrder, orderPlaced, shipped, weeklyCost, totalCost}
  };
}

class BeerGameEngine {
  // config: {
  //   roleAssignments: { retailer:{id,name,isBot}, wholesaler:{...}, ... , facilitator:{...} },
  //   totalWeeks, holdingCost, stockoutCost: all optional, fall back to DEFAULT_* above
  // }
  constructor(config) {
    config = config || {};
    this.week = 1;
    this.totalWeeks = clamp(Math.round(Number(config.totalWeeks) || DEFAULT_TOTAL_WEEKS), MIN_TOTAL_WEEKS, MAX_TOTAL_WEEKS);
    this.holdingCost = Number(config.holdingCost) > 0 ? Number(config.holdingCost) : DEFAULT_HOLDING_COST;
    this.stockoutCost = Number(config.stockoutCost) > 0 ? Number(config.stockoutCost) : DEFAULT_STOCKOUT_COST;
    // Mandatory order-shift from active news, mirroring how holdingCost/
    // stockoutCost above get mutated externally by ui.js's
    // applyGlobalNewsCostEffect. activeOrderShift is the Global News
    // effect - it applies to every role's order AND the Facilitator's
    // consumer demand, since a nationwide event affects everyone.
    // activeLocalOrderShiftByRole is per chain-role only (Local News has
    // no equivalent for the Facilitator, who doesn't place an order).
    // Both default to 0 (no active news yet) and get set via
    // setNewsOrderShifts() below whenever the active news changes.
    this.activeOrderShift = 0;
    this.activeLocalOrderShiftByRole = { retailer: 0, wholesaler: 0, distributor: 0, manufacturer: 0 };
    // Facilitator interventions (all inactive by default, so a game that never
    // touches them plays exactly as before). See setInterventions below.
    this.interventions = { infoScope: 'off', caps: {}, costs: {} };
    this.gameOver = false;
    this.roles = {};
    CHAIN.forEach(r => { this.roles[r] = makeRoleState(r); });
    this.roleAssignments = config.roleAssignments || {};
    ['retailer', 'wholesaler', 'distributor', 'manufacturer', 'facilitator'].forEach(r => {
      if (!this.roleAssignments[r]) this.roleAssignments[r] = { id: 'BOT_' + r, name: 'AI ' + ROLE_LABELS[r], isBot: true };
    });
    this.weekHistory = [];
    this.finalResults = null;
    this.baseline = null; // computed once gameOver: see computeBaseline()
  }

  isFixedOrderWeek(week) {
    return week <= FIXED_ORDER_WEEKS;
  }

  // consumer demand for a given week when there's no live human facilitator :
  // a plausible, transparently-labeled stand-in for the classroom exercise's
  // usual improvised/scripted demand. Stays well inside the spec's 14/week
  // guidance by construction, though no hard cap is enforced anywhere.
  //
  // The value is generated once per week and then remembered. That matters
  // now that a role can be shown its incoming order BEFORE the week resolves
  // (see previewIncomingOrders below): without remembering it, the number a
  // player was shown and the number the engine later used would be two
  // different random draws.
  autoConsumerDemand(week) {
    if (week <= FIXED_ORDER_WEEKS) return FIXED_ORDER_QTY;
    if (!this._autoDemandByWeek) this._autoDemandByWeek = {};
    if (this._autoDemandByWeek[week] != null) return this._autoDemandByWeek[week];
    const base = week <= 4 ? 4 : 8;
    const noise = Math.round(rand(-1, 2));
    const value = Math.max(0, Math.round(base + noise));
    this._autoDemandByWeek[week] = value;
    return value;
  }

  // ---- Facilitator interventions ----
  // Three levers a Facilitator can pull when one role is stuck in a spiral:
  //   infoScope: 'off' | 'wholesaler' | 'chain'. The Retailer's data (stock,
  //     backlog, and the real customer demand) is shared with the Wholesaler or
  //     the whole chain. The UI shows it to human players; here it also changes
  //     how AI seats order: they work from the real customer demand instead of
  //     the order their own buyer placed, which is the point of sharing it.
  //   caps: { role: { max, untilWeek } }. A ceiling on that role's final order
  //     (after any news shift) up to and including week `untilWeek`.
  //   costs: { 'all' | role: { holding?, stockout? } }. Rates that replace the
  //     game's for that role from the next week resolved onward; past weeks are
  //     never recomputed.
  // Always replaced as one object so a stale field can't linger.
  setInterventions(iv) {
    const src = iv || {};
    const num = v => (v === null || v === undefined || v === '' || !isFinite(Number(v)) || Number(v) < 0) ? null : Number(v);
    const caps = {};
    Object.keys(src.caps || {}).forEach(role => {
      const c = src.caps[role]; const max = c ? num(c.max) : null; const until = c ? num(c.untilWeek) : null;
      if (CHAIN.includes(role) && max != null && until != null && until >= 1) caps[role] = { max: Math.round(max), untilWeek: Math.round(until) };
    });
    const costs = {};
    Object.keys(src.costs || {}).forEach(key => {
      if (key !== 'all' && !CHAIN.includes(key)) return;
      const c = src.costs[key] || {}; const e = {};
      const h = num(c.holding), s = num(c.stockout);
      if (h != null) e.holding = h;
      if (s != null) e.stockout = s;
      if (Object.keys(e).length) costs[key] = e;
    });
    const infoScope = (src.infoScope === 'wholesaler' || src.infoScope === 'chain') ? src.infoScope : 'off';
    this.interventions = { infoScope, caps, costs };
  }
  // Does `role` get to work from the Retailer's real customer data?
  infoSharedWith(role) {
    const s = this.interventions.infoScope;
    return s === 'chain' ? role !== 'retailer' : (s === 'wholesaler' && role === 'wholesaler');
  }
  // The ceiling on `role`'s order in `week`, or null if there is none.
  orderCapFor(role, week) {
    const c = this.interventions.caps[role];
    return c && week <= c.untilWeek ? c.max : null;
  }
  hasCostOverride(role) {
    const c = this.interventions.costs;
    return !!(c.all || c[role]);
  }
  // Holding and stockout rate that apply to `role` right now.
  costRatesFor(role) {
    let holding = this.holdingCost, stockout = this.stockoutCost;
    const c = this.interventions.costs;
    [c.all, c[role]].forEach(o => {
      if (o) { if (o.holding != null) holding = o.holding; if (o.stockout != null) stockout = o.stockout; }
    });
    return { holding, stockout };
  }

  // AI heuristic for any unfilled role: reacts to last week's order plus an
  // assertive backlog correction (see aiOrderDecision below for the full
  // empirical tuning story - a fancier trend-following version was tried
  // and measurably lost to this simpler one). It's noticeably more
  // competent than a weaker backlog correction, so bot-controlled seats are
  // genuinely competitive rather than an easy win, but it still can't see
  // the future, so the bullwhip effect can still emerge, especially over a
  // long game - which is the correct lesson for this exercise, not a flaw
  // to eliminate. Crucially, this only looks at *prior* weeks' recorded
  // history, never the current week's in-progress numbers, so a bot never
  // reacts to anything from the current week, and every order is still
  // locked in before any of them is applied. (A human role is shown the
  // order its buyer placed once that buyer has submitted - see
  // previewIncomingOrders - the way the classroom game hands a player the
  // order slip. That is information given to the player, not the bot
  // reacting to anyone.)
  // Called from ui.js whenever the active Global/Local news changes -
  // same trigger point as applyGlobalNewsCostEffect for the cost
  // multipliers. localShiftByRole only needs to contain the roles that
  // actually have active local news; any role missing from it is treated
  // as 0 (no local news currently affecting them).
  setNewsOrderShifts(globalShift, localShiftByRole) {
    this.activeOrderShift = Number(globalShift) || 0;
    CHAIN.forEach(role => {
      this.activeLocalOrderShiftByRole[role] = Number((localShiftByRole || {})[role]) || 0;
    });
  }

  aiOrderDecision(role) {
    if (this.isFixedOrderWeek(this.week)) return FIXED_ORDER_QTY;
    const r = this.roles[role];
    const lastWeek = r.history.length ? r.history[r.history.length - 1] : null;
    let lastIncoming = lastWeek ? lastWeek.incomingOrder : FIXED_ORDER_QTY;
    // Information sharing: a seat that can see the Retailer's real customer
    // demand orders from that, not from the (possibly panic-inflated) order
    // its own buyer placed.
    if (this.infoSharedWith(role) && this.weekHistory.length) lastIncoming = this.weekHistory[this.weekHistory.length - 1].consumerDemand;

    // Backlog is a direct, unambiguous shortfall, corrected so it doesn't
    // linger and compound. This fraction was re-tuned empirically across
    // six demand patterns (steady, step-up, ramp, oscillating, a sharp
    // spike-then-reversal, and a late shock) plus 300 runs of randomized
    // realistic demand, measuring BOTH total chain cost AND service level
    // (whether the chain actually clears its backlog rather than just
    // ordering less and looking cheap).
    //
    // That distinction mattered: purely by cost, a fraction of 0 scored
    // best of everything tested, but it leaves large amounts of demand
    // permanently unfulfilled - cheap precisely because it stops trying to
    // serve customers, which is the wrong lesson for a supply-chain
    // exercise. 0.3 is the lowest value that still fully clears backlog
    // wherever 0.4 did, while costing roughly 15-20% less across every
    // pattern tested.
    //
    // Also tested and rejected: a smoothed 3-week average of incoming
    // demand (30% worse), and classic order-up-to policies with a pipeline
    // term (800%+ worse - they diverge badly here because the 2-week lead
    // time plus four chained stages amplifies any target-chasing).
    const BACKLOG_CATCHUP_FRACTION = 0.3;
    const backlogCatchUp = Math.round(r.backlog * BACKLOG_CATCHUP_FRACTION);
    const baseQty = Math.max(0, lastIncoming + backlogCatchUp);

    // Optional market-aware nudge (see market.js): a small, bounded
    // adjustment based on real/simulated beer-industry stock trend, applied
    // only if that module is loaded and has data. This never replaces the
    // policy above, it only nudges it, so bot behavior stays sound even
    // with no market data at all.
    if (typeof marketAwareOrderAdjustment === 'function') {
      return marketAwareOrderAdjustment(baseQty);
    }
    return baseQty;
  }

  // decisionsMap: { retailer: qty, wholesaler: qty, distributor: qty, manufacturer: qty, facilitator: consumerDemandQty }
  // any role missing from the map (or marked as a bot) falls back to the AI heuristic / auto demand generator :
  // identical fallback pattern to Malt & Ledger's engine, for the same reason: bots and absent humans behave the same way.
  // Step A of a week on its own: lock in the consumer demand and every chain
  // role's order for the CURRENT week from a decisions map, using only state
  // as of the end of last week. processWeek calls this, and so does the UI
  // (through previewIncomingOrders), which is what guarantees a number shown
  // to a player early is exactly the number the engine later uses.
  resolveDecisions(decisionsMap) {
    const map = decisionsMap || {};
    const week = this.week;

    // ---- Step A: lock in every role's order decision FIRST, using only
    // state as of the end of last week: this is what makes it simultaneous
    // rather than a cascade where later roles could react to earlier ones.
    // A value supplied here always wins, whether or not this engine's own
    // facilitator seat is a bot. This is what lets a single, room-wide
    // Facilitator (see ui.js) drive the same consumer demand across every
    // team's engine, rather than each team's engine deciding independently.
    // Active Global News is a mandatory shift, applied here regardless of
    // whether the number came from a human or autoConsumerDemand - a
    // nationwide event doesn't ask permission. Not applied during the two
    // fixed weeks, which are meant to be a stable, unaffected baseline.
    const rawConsumerDemand = (map.facilitator != null)
      ? Math.max(0, Math.round(Number(map.facilitator) || 0))
      : this.autoConsumerDemand(week);
    const consumerDemand = this.isFixedOrderWeek(week)
      ? rawConsumerDemand
      : Math.max(0, rawConsumerDemand + this.activeOrderShift);

    const cappedBy = {};
    const decisionFor = (role) => {
      if (this.isFixedOrderWeek(week)) return FIXED_ORDER_QTY;
      const assignment = this.roleAssignments[role];
      const raw = assignment.isBot
        ? this.aiOrderDecision(role)
        : (map[role] == null ? this.aiOrderDecision(role) : clamp(Math.round(Number(map[role]) || 0), 0, 9999));
      // Mandatory shift from Global News (everyone) plus this role's own
      // Local News (chain roles only) - applied uniformly whether the
      // number above came from a bot or a human, same reasoning as
      // consumer demand: the news doesn't check who's deciding.
      const shift = this.activeOrderShift + (this.activeLocalOrderShiftByRole[role] || 0);
      const placed = clamp(raw + shift, 0, 9999);
      // A Facilitator-set ceiling is the last word on the number.
      const cap = this.orderCapFor(role, week);
      if (cap != null && placed > cap) { cappedBy[role] = cap; return cap; }
      return placed;
    };
    const orderDecision = {};
    CHAIN.forEach(role => { orderDecision[role] = decisionFor(role); });
    return { consumerDemand, orderDecision, cappedBy };
  }

  // The order each role is facing this week, i.e. what its buyer has placed:
  // the Retailer faces consumer demand, the Wholesaler faces the Retailer's
  // order, and so on. Pass the decisions entered so far (anything missing
  // falls back exactly as it does when the week resolves).
  previewIncomingOrders(decisionsMap) {
    const { consumerDemand, orderDecision } = this.resolveDecisions(decisionsMap);
    return {
      retailer: consumerDemand,
      wholesaler: orderDecision.retailer,
      distributor: orderDecision.wholesaler,
      manufacturer: orderDecision.distributor,
    };
  }

  processWeek(decisionsMap) {
    if (this.gameOver) return null;
    const week = this.week;

    // ---- Step A: lock in every role's order decision FIRST (see
    // resolveDecisions above), using only state as of the end of last week:
    // this is what makes it simultaneous rather than a cascade where later
    // roles could react to earlier ones.
    const { consumerDemand, orderDecision } = this.resolveDecisions(decisionsMap);

    // ---- Step B: mechanical resolution of the week, now that every
    // decision is locked in. Phase 1: receive shipments in transit.
    CHAIN.forEach(role => { this.roles[role].stock += this.roles[role].incomingShipments.shift(); });

    // Phase 2: each role's incoming order this week = downstream neighbor's
    // just-locked-in decision (retailer's "downstream" is the end consumer)
    this.roles.retailer.incomingOrderThisWeek = consumerDemand;
    this.roles.wholesaler.incomingOrderThisWeek = orderDecision.retailer;
    this.roles.distributor.incomingOrderThisWeek = orderDecision.wholesaler;
    this.roles.manufacturer.incomingOrderThisWeek = orderDecision.distributor;

    // Phase 3: each role ships to fulfill (backlog + incoming order) from available stock
    CHAIN.forEach(role => {
      const r = this.roles[role];
      const demand = r.backlog + r.incomingOrderThisWeek;
      const shipped = Math.min(r.stock, demand);
      r.stock -= shipped;
      r.backlog = demand - shipped;
      r.shippedThisWeek = shipped;
    });

    // Phase 4: shipments become pipeline entries for the downstream role, arriving in LEAD_TIME weeks
    // (manufacturer's own order always fulfills in full from "the factory": no upstream stockout risk)
    this.roles.retailer.incomingShipments.push(this.roles.wholesaler.shippedThisWeek);
    this.roles.wholesaler.incomingShipments.push(this.roles.distributor.shippedThisWeek);
    this.roles.distributor.incomingShipments.push(this.roles.manufacturer.shippedThisWeek);
    this.roles.manufacturer.incomingShipments.push(orderDecision.manufacturer); // factory always fulfills in full

    // Phase 5: record each role's own order placed this week, and cost
    const costOverrides = {};
    CHAIN.forEach(role => {
      const r = this.roles[role];
      r.orderPlacedThisWeek = orderDecision[role];
      const rates = this.costRatesFor(role);
      if (this.hasCostOverride(role)) costOverrides[role] = rates;
      const weeklyCost = r.stock * rates.holding + r.backlog * rates.stockout;
      r.totalCost += weeklyCost;
      r.history.push({
        week, stock: r.stock, backlog: r.backlog, incomingOrder: r.incomingOrderThisWeek,
        orderPlaced: r.orderPlacedThisWeek, shipped: r.shippedThisWeek, weeklyCost, totalCost: r.totalCost,
      });
    });

    const weekEntry = {
      week, consumerDemand,
      roles: CHAIN.reduce((acc, role) => { acc[role] = { ...this.roles[role].history[this.roles[role].history.length - 1] }; return acc; }, {}),
    };
    // Only present in weeks where a Facilitator cost change was in force, so a
    // game that never uses one records exactly what it always did.
    if (Object.keys(costOverrides).length) weekEntry.costOverrides = costOverrides;
    this.weekHistory.push(weekEntry);

    if (week >= this.totalWeeks) {
      this.gameOver = true;
      this.finalResults = this.getStandings();
      this.baseline = this.computeBaseline();
    } else {
      this.week += 1;
    }
    return this.weekHistory[this.weekHistory.length - 1];
  }

  getStandings() {
    return CHAIN
      .map(role => ({ role, label: ROLE_LABELS[role], totalCost: this.roles[role].totalCost, assignment: this.roleAssignments[role] }))
      .sort((a, b) => a.totalCost - b.totalCost); // LOWEST cost wins
  }

  // BASELINE: "what would this have cost with zero bullwhip?": replays the
  // exact same consumer demand sequence that actually occurred, but with
  // every role doing pure pass-through ordering (order placed = order just
  // received, no reaction, no amplification, no backlog catch-up at all).
  // This isolates how much of the real game's cost came specifically from
  // the bullwhip dynamics, versus the demand pattern itself.
  computeBaseline() {
    const baseRoles = {};
    CHAIN.forEach(r => { baseRoles[r] = makeRoleState(r); });
    let baseTotal = 0;
    const perRole = {};
    CHAIN.forEach(r => { perRole[r] = 0; });

    this.weekHistory.forEach(wk => {
      const incoming = {
        retailer: wk.consumerDemand,
        wholesaler: baseRoles.retailer.orderPlacedThisWeek != null ? baseRoles.retailer.orderPlacedThisWeek : FIXED_ORDER_QTY,
        distributor: baseRoles.wholesaler.orderPlacedThisWeek != null ? baseRoles.wholesaler.orderPlacedThisWeek : FIXED_ORDER_QTY,
        manufacturer: baseRoles.distributor.orderPlacedThisWeek != null ? baseRoles.distributor.orderPlacedThisWeek : FIXED_ORDER_QTY,
      };
      CHAIN.forEach(role => { baseRoles[role].stock += baseRoles[role].incomingShipments.shift(); });
      CHAIN.forEach(role => { baseRoles[role].incomingOrderThisWeek = incoming[role]; });
      CHAIN.forEach(role => {
        const r = baseRoles[role];
        const demand = r.backlog + r.incomingOrderThisWeek;
        const shipped = Math.min(r.stock, demand);
        r.stock -= shipped;
        r.backlog = demand - shipped;
        r.shippedThisWeek = shipped;
        r.orderPlacedThisWeek = r.incomingOrderThisWeek; // pure pass-through, zero reaction
      });
      baseRoles.retailer.incomingShipments.push(baseRoles.wholesaler.shippedThisWeek);
      baseRoles.wholesaler.incomingShipments.push(baseRoles.distributor.shippedThisWeek);
      baseRoles.distributor.incomingShipments.push(baseRoles.manufacturer.shippedThisWeek);
      baseRoles.manufacturer.incomingShipments.push(baseRoles.manufacturer.orderPlacedThisWeek);
      CHAIN.forEach(role => {
        const r = baseRoles[role];
        // The baseline is charged the same rates the real game was, week by week.
        const rates = (wk.costOverrides && wk.costOverrides[role]) || { holding: this.holdingCost, stockout: this.stockoutCost };
        const weeklyCost = r.stock * rates.holding + r.backlog * rates.stockout;
        r.totalCost += weeklyCost;
        perRole[role] += weeklyCost;
        baseTotal += weeklyCost;
      });
    });
    return { perRole, total: baseTotal };
  }

  // what a given role is allowed to see: enforces the hidden-information design
  getVisibleStateFor(role) {
    if (role === 'facilitator') {
      const all = {};
      CHAIN.forEach(r => { all[r] = this.roles[r]; });
      return {
        everything: all, week: this.week, weekHistory: this.weekHistory,
        totalWeeks: this.totalWeeks, isFixedOrderWeek: this.isFixedOrderWeek(this.week),
      };
    }
    const own = this.roles[role];
    return {
      own,
      week: this.week,
      totalWeeks: this.totalWeeks,
      upstreamLabel: ROLE_LABELS[UPSTREAM_OF[role]] || 'Factory',
      isFixedOrderWeek: this.isFixedOrderWeek(this.week),
    };
  }
}

if (typeof module !== 'undefined') {
  module.exports = {
    BeerGameEngine, CHAIN, ROLE_LABELS, STARTING_STOCK, LEAD_TIME, FIXED_ORDER_QTY,
    DEFAULT_TOTAL_WEEKS, DEFAULT_HOLDING_COST, DEFAULT_STOCKOUT_COST, MIN_TOTAL_WEEKS, MAX_TOTAL_WEEKS,
  };
}




// ===== The Beer Game (LA4): Beer-Industry Stock Chart & AI Market Awareness =====
//
// SCOPE, STATED PLAINLY:
// 1. There is no single "beer stock price" as a data series. This charts a
//    real, named beer company's stock: Anheuser-Busch InBev (ticker BUD),
//    the world's largest brewer, as an honest, clearly-labeled proxy for
//    "the beer industry," via the Alpha Vantage API.
// 2. ALPHA_VANTAGE_API_KEY is intentionally blank by default. This file is
//    distributed as a public static page; baking in a real key would expose
//    it to anyone who views the source, and Alpha Vantage's free tier is
//    rate-limited low enough that one shared key would be exhausted almost
//    immediately in real multiplayer use. Fill in your own key below only
//    for a deployment you control, understanding it will then be visible to
//    anyone who can view that deployment's source.
// 3. When no key is configured, or the live fetch fails/rate-limits, this
//    falls back to a clearly-labeled simulated price series so the chart and
//    the AI market-awareness feature both keep working. The core game must
//    never depend on a third-party API being up.

// Hidden per Rick's explicit request in the requirements meeting ("hide this
// chart first, don't show it up"). Left as a single flag, not deleted, so
// it's a one-line change to bring back if that decision changes later.
const SHOW_MARKET_CHART = false;

const ALPHA_VANTAGE_API_KEY = 'IJ6GPD8IWYRTSQLD'; // confirmed working by the user directly against Alpha Vantage. See the
                                                    // note above: this means the key is visible to anyone who views this
                                                    // page's source, and the shared free-tier quota can be exhausted by
                                                    // real multiplayer use. Applied at the user's explicit, informed request.
const BEER_STOCK_SYMBOL = 'BUD';  // Anheuser-Busch InBev, used as an honest, named proxy, not a fictional "beer index"
const BEER_STOCK_LABEL = 'Anheuser-Busch InBev (BUD)';

const marketData = {
  series: null,       // [{date, close}], oldest first
  isLive: false,      // true if this came from a real Alpha Vantage fetch
  trendPct: 0,         // % change from first to last point in the series
  loading: false,
  error: null,
};

// Deterministic-looking but simulated series, used whenever there's no live
// data available, so the chart and AI nudge always have something coherent
// to work with instead of breaking.
function generateSimulatedSeries(days = 30) {
  const series = [];
  let price = 60 + Math.random() * 10; // beer-stock-ish starting price
  const today = new Date();
  for (let i = days - 1; i >= 0; i--) {
    price += (Math.random() - 0.48) * 1.5; // gentle random walk with a slight upward bias
    price = Math.max(20, price);
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    series.push({ date: d.toISOString().slice(0, 10), close: Math.round(price * 100) / 100 });
  }
  return series;
}

function computeTrendPct(series) {
  if (!series || series.length < 2) return 0;
  const first = series[0].close, last = series[series.length - 1].close;
  if (!first) return 0;
  return ((last - first) / first) * 100;
}

// Fetches BUD's recent daily closes from Alpha Vantage. Returns null (never
// throws) on any failure: missing key, network error, or a rate-limit
// response, so callers can always fall back cleanly.
async function fetchLiveBeerStockSeries() {
  if (!ALPHA_VANTAGE_API_KEY) return { series: null, reason: null };
  try {
    const url = `https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${BEER_STOCK_SYMBOL}&outputsize=compact&apikey=${ALPHA_VANTAGE_API_KEY}`;
    // Plain fetch with a Promise.race timeout, deliberately NOT using
    // AbortController here. An AbortSignal passed into fetch() options
    // triggered a DataCloneError in real-world testing, most likely because
    // something in the request pipeline (browser extension, dev tools
    // protocol, or the file:// context this game often runs from) attempts
    // to structured-clone the request, and AbortSignal objects are not
    // reliably cloneable. A timeout promise avoids passing anything
    // non-standard into fetch() at all.
    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000));
    const res = await Promise.race([fetch(url), timeoutPromise]);
    const data = await res.json();
    // Alpha Vantage returns 200 OK even for rate-limit/error responses,
    // the actual signal is in these fields, not the HTTP status. Surface the
    // exact text back rather than collapsing every failure into one message,
    // this is usually either a daily rate limit, or TIME_SERIES_DAILY sitting
    // behind a higher access tier than GLOBAL_QUOTE on newer Alpha Vantage plans.
    if (data['Note']) return { series: null, reason: 'Alpha Vantage: ' + data['Note'] };
    if (data['Information']) return { series: null, reason: 'Alpha Vantage: ' + data['Information'] };
    if (data['Error Message']) return { series: null, reason: 'Alpha Vantage: ' + data['Error Message'] };
    const series = data['Time Series (Daily)'];
    if (!series) return { series: null, reason: 'Alpha Vantage returned no recognizable data for this request.' };
    const dates = Object.keys(series).sort(); // ascending, oldest first
    const last30 = dates.slice(-30);
    return { series: last30.map(date => ({ date, close: Number(series[date]['4. close']) })), reason: null };
  } catch (e) {
    // network failure, timeout, abort, CORS rejection, or JSON parse error all land here,
    // browsers intentionally hide the exact cause of a CORS failure from JS for security reasons
    return { series: null, reason: 'Request failed (' + (e.name || 'network error') + '), possibly CORS, offline, or a timeout.' };
  }
}

// Call once per session (e.g. when a setup screen mounts), never on every render.
async function loadMarketData() {
  if (marketData.series && (marketData.isLive || !ALPHA_VANTAGE_API_KEY)) return marketData; // already loaded this session
  marketData.loading = true;
  const result = await fetchLiveBeerStockSeries();
  if (result.series && result.series.length >= 2) {
    marketData.series = result.series;
    marketData.isLive = true;
    marketData.error = null;
  } else {
    marketData.series = generateSimulatedSeries();
    marketData.isLive = false;
    marketData.error = result.reason; // null if no key configured at all; the specific reason otherwise
  }
  marketData.trendPct = computeTrendPct(marketData.series);
  marketData.loading = false;
  return marketData;
}

// AI MARKET AWARENESS: an optional, bounded nudge on top of the existing
// naive ordering heuristic, never a replacement for it. If the trend is
// strongly up, bots trim their order slightly (prices rising -> be a little
// more cautious about committing to more stock); if strongly down, they
// nudge slightly higher (cheaper -> a little more willing to stock up).
// The adjustment is capped small on purpose so bot behavior stays close to
// its original, predictable pattern regardless of whether live data exists.
function marketAwareOrderAdjustment(baseQty) {
  const trend = marketData.trendPct || 0;
  if (Math.abs(trend) < 3) return baseQty; // ignore noise
  const factor = clamp(1 - trend / 200, 0.85, 1.15); // +/-15% max nudge
  return Math.max(0, Math.round(baseQty * factor));
}

function renderMarketChart(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const series = marketData.series;
  if (!series || series.length < 2) return;

  const padding = 36;
  const prices = series.map(p => p.close);
  const minP = Math.min(...prices), maxP = Math.max(...prices);
  const range = (maxP - minP) || 1;
  const chartW = W - padding * 1.5, chartH = H - padding * 1.6;

  // gridlines
  ctx.strokeStyle = 'rgba(242,232,213,0.12)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const y = padding * 0.6 + (chartH / 3) * i;
    ctx.beginPath(); ctx.moveTo(padding, y); ctx.lineTo(W - 10, y); ctx.stroke();
  }

  // line path
  ctx.beginPath();
  series.forEach((p, i) => {
    const x = padding + (chartW / (series.length - 1)) * i;
    const y = padding * 0.6 + chartH - ((p.close - minP) / range) * chartH;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = marketData.isLive ? '#86A86A' : '#E0A94A';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // fill under the line
  const lastX = padding + chartW;
  ctx.lineTo(lastX, padding * 0.6 + chartH);
  ctx.lineTo(padding, padding * 0.6 + chartH);
  ctx.closePath();
  ctx.fillStyle = marketData.isLive ? 'rgba(134,168,106,0.12)' : 'rgba(224,169,74,0.10)';
  ctx.fill();

  // axis labels (min/max price, first/last date)
  ctx.fillStyle = '#A8987B';
  ctx.font = '11px Calibri, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('$' + maxP.toFixed(2), 4, padding * 0.6 + 4);
  ctx.fillText('$' + minP.toFixed(2), 4, padding * 0.6 + chartH);
  ctx.textAlign = 'left';
  ctx.fillText(series[0].date, padding, H - 8);
  ctx.textAlign = 'right';
  ctx.fillText(series[series.length - 1].date, W - 10, H - 8);

  // ---- data point labels ----
  // Labeling every point on a ~30-day series would be unreadable at this
  // size, so label an evenly-spaced subset (always including the very first
  // and very last points) with small markers, and call out the most recent
  // price specifically since that's the one number people actually look for.
  const pointXY = series.map((p, i) => ({
    x: padding + (chartW / (series.length - 1)) * i,
    y: padding * 0.6 + chartH - ((p.close - minP) / range) * chartH,
    close: p.close,
  }));
  const maxLabels = 6;
  const step = Math.max(1, Math.ceil((series.length - 1) / (maxLabels - 1)));
  const labeledIndices = new Set();
  for (let i = 0; i < series.length; i += step) labeledIndices.add(i);
  labeledIndices.add(series.length - 1); // always label the most recent point

  ctx.font = '10px Calibri, sans-serif';
  labeledIndices.forEach((i) => {
    const pt = pointXY[i];
    const isLast = i === series.length - 1;
    // marker dot
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, isLast ? 3.5 : 2.5, 0, Math.PI * 2);
    ctx.fillStyle = isLast ? '#F2E8D5' : (marketData.isLive ? '#86A86A' : '#E0A94A');
    ctx.fill();
    if (isLast) { ctx.strokeStyle = '#1b1712'; ctx.lineWidth = 1.5; ctx.stroke(); }
    // value label: flip above/below the point depending on where there's room, so
    // labels near the top/bottom of the chart don't run off the canvas edge
    const labelAbove = pt.y > padding * 0.6 + 12;
    const labelY = labelAbove ? pt.y - 8 : pt.y + 14;
    ctx.textAlign = 'center';
    ctx.fillStyle = isLast ? '#F2E8D5' : '#A8987B';
    ctx.font = isLast ? 'bold 11px Calibri, sans-serif' : '10px Calibri, sans-serif';
    ctx.fillText('$' + pt.close.toFixed(2), pt.x, labelY);
  });
}






// ===== The Beer Game: Multiplayer Transport & Room Management =====
//
// TWO TRANSPORT MODES:
// 1. Same-device (default, no server URL given): uses the browser's
//    BroadcastChannel API. Connects tabs/windows of this file on ONE browser,
//    ONE device only: no internet involved, nothing to configure.
// 2. Online (a server URL is provided): connects to a real WebSocket relay
//    server (see server.js), which genuinely reaches other devices, other
//    networks, other time zones: anyone with the room code and the server's
//    address. The relay server does no game logic at all; it only forwards
//    messages between clients in the same room, so this file's game engine
//    and UI code work completely unchanged regardless of which mode is active.

// ===== The Beer Game: Multiplayer Transport & Room Management =====
//
// TWO TRANSPORT MODES:
// 1. Same-device (fallback, no server configured): uses the browser's
//    BroadcastChannel API. Connects tabs/windows of this file on ONE
//    browser, ONE device only: no internet involved, nothing to configure.
// 2. Online (DEFAULT_SERVER_URL below is set): connects to a real WebSocket
//    relay server (see relay-server/), which genuinely reaches other
//    devices, other networks, other timezones: anyone with just the room
//    code. The relay server does no game logic at all; it only forwards
//    messages between clients in the same room, so this file's game engine
//    and UI code work completely unchanged regardless of which mode is active.
//
// SET THIS ONCE to make every room in the game "just enter a code" on any
// device, automatically: no one ever has to type or paste a server URL.
// Deploy relay-server/ (see relay-server/README.md: Render's free tier
// takes about 5 minutes), then paste the wss:// URL it gives you below.
// Leave it blank to fall back to same-device-only play (still fully working,
// just limited to tabs on one browser).
const DEFAULT_SERVER_URL = 'ws://localhost:19557';

const ROOM_CHANNEL_PREFIX = 'beergame_la4_room_';
const ROOM_CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I to avoid ambiguity

function generateRoomCode(len = 5) {
  let code = '';
  for (let i = 0; i < len; i++) code += ROOM_CODE_CHARS[Math.floor(Math.random() * ROOM_CODE_CHARS.length)];
  return code;
}

class RoomTransport {
  // serverUrl: e.g. "wss://your-app.onrender.com": omit/empty for same-device play
  constructor(roomCode, serverUrl) {
    this.roomCode = roomCode;
    this.handlers = [];
    this.errorHandlers = [];
    this.statusHandlers = [];  // transient connecting/reconnecting notices, not fatal errors
    this.mode = serverUrl ? 'websocket' : 'broadcast';
    this.sendQueue = [];
    this.wsOpen = false;

    if (this.mode === 'websocket') {
      const base = serverUrl.replace(/\/+$/, '');
      this.url = base + '?room=' + encodeURIComponent(roomCode);
      this.closedByUs = false;
      // Free hosting tiers (Render, Railway, Fly) put an idle service to
      // sleep and take roughly 30-60 seconds to wake on the next request.
      // A single connection attempt during that window just fails, which
      // looked to players like the room code was wrong. So retry for a
      // while before giving up, and tell them what's actually happening.
      this.retriesLeft = 12;      // ~12 attempts x 5s = about a minute
      this.retryDelayMs = 5000;
      this.everConnected = false;
      this._wakeThenConnect();
    } else {
      this.supported = typeof BroadcastChannel !== 'undefined';
      this.channel = this.supported ? new BroadcastChannel(ROOM_CHANNEL_PREFIX + roomCode) : null;
      if (this.channel) this.channel.onmessage = (e) => this.handlers.forEach(h => h(e.data));
    }
  }
  // Free hosting tiers put an idle service to sleep. Waking it needs a
  // plain HTTP request: a WebSocket upgrade aimed at a sleeping service
  // gets answered by the platform's router (Render returns 404) rather
  // than reaching the app, so the socket fails even though the deployment
  // is perfectly healthy. Firing a normal fetch first wakes the service,
  // then the upgrade lands on the real server.
  _wakeThenConnect() {
    const httpUrl = this.url.replace(/^wss:/, 'https:').replace(/^ws:/, 'http:');
    let settled = false;
    const go = () => { if (!settled) { settled = true; this._connect(); } };
    try {
      // no-cors: we don't need to read the response, only to make the
      // platform route a request to the app and spin it up.
      fetch(httpUrl, { mode: 'no-cors', cache: 'no-store' }).then(go).catch(go);
    } catch (e) { go(); return; }
    // don't wait forever on the wake ping
    setTimeout(go, 4000);
  }
  _connect() {
    try {
      this.ws = new WebSocket(this.url);
    } catch (e) {
      this.errorHandlers.forEach(h => h('Could not reach the multiplayer server.'));
      return;
    }
    this.ws.addEventListener('open', () => {
      this.wsOpen = true;
      this.everConnected = true;
      this.retriesLeft = 12; // replenish, so a later drop also gets retries
      this.statusHandlers.forEach(h => h(null)); // clear any "connecting" notice
      this.sendQueue.forEach(msg => this.ws.send(JSON.stringify(msg)));
      this.sendQueue = [];
    });
    this.ws.addEventListener('message', (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch (err) { return; }
      this.handlers.forEach(h => h(data));
    });
    this.ws.addEventListener('error', () => { /* handled in close, which always follows */ });
    this.ws.addEventListener('close', () => {
      this.wsOpen = false;
      if (this.closedByUs) return;
      if (this.retriesLeft > 0) {
        this.retriesLeft--;
        const attempt = 12 - this.retriesLeft;
        this.statusHandlers.forEach(h => h(
          this.everConnected
            ? `Connection dropped. Reconnecting… (attempt ${attempt})`
            : `Waking up the game server, this can take up to a minute on first use… (attempt ${attempt})`
        ));
        setTimeout(() => { if (!this.closedByUs) this._wakeThenConnect(); }, this.retryDelayMs);
      } else {
        this.errorHandlers.forEach(h => h(
          "Couldn't reach the game server after about a minute of trying. It may be offline. " +
          'Ask the host to confirm the server is deployed and running, then try again.'
        ));
      }
    });
  }
  send(msg) {
    if (this.mode === 'websocket') {
      if (this.wsOpen) this.ws.send(JSON.stringify(msg));
      else this.sendQueue.push(msg); // flushed once the socket opens
    } else if (this.channel) {
      this.channel.postMessage(msg);
    }
  }
  onMessage(handler) {
    this.handlers.push(handler);
  }
  onError(handler) {
    this.errorHandlers.push(handler);
  }
  // Fires with a message while the connection is being (re)established, and
  // with null once it succeeds. Distinct from onError, which only fires once
  // we have genuinely given up.
  onStatus(handler) {
    this.statusHandlers.push(handler);
  }
  close() {
    this.closedByUs = true;   // stops the retry loop from firing after a deliberate close
    if (this.mode === 'websocket') {
      if (this.ws) this.ws.close();
    } else if (this.channel) {
      this.channel.close();
    }
    this.handlers = [];
    this.errorHandlers = [];
    this.statusHandlers = [];
  }
}

function defaultScenarioConfig(key) {
  const sc = MARKET_SCENARIOS[key];
  const cfg = { key, baseSupply: sc.baseSupply, baseDemand: sc.baseDemand };
  if (sc.extra) cfg[sc.extra.key] = sc.extra.default;

function renderScenarioIconBoxes(idPrefix, config) {
  const selected = config.key;
  return `
  <div class="field">
    <label>Market Scenario <span class="opt-tag">click one to view or edit its settings</span></label>
    <div class="scenario-icon-row" id="${idPrefix}ScenarioIcons">

function scenarioSummaryText(config) {
  const sc = MARKET_SCENARIOS[config.key];
  let extra = '';
  if (sc.extra) {
    const v = config[sc.extra.key];
    extra = sc.extra.type === 'select' ? ` · ${sc.extra.label}: ${v}` : ` · ${sc.extra.label}: ${sc.extra.prefix}${Number(v).toFixed(2)}`;
  }
  const supplyBit = SHOW_SCENARIO_BASE_SUPPLY ? `Supply ${config.baseSupply} · ` : '';
  return `${sc.desc} (${supplyBit}Demand ${config.baseDemand}${extra})`;
}

function bindScenarioIconBoxes(idPrefix, getConfig, setConfig) {
  const openOverlay = (key) => {
    const overlay = document.getElementById(`${idPrefix}ScenarioOverlay`);
    const cur = getConfig();
    overlay.innerHTML = scenarioOverlayHtml(idPrefix, key, cur.key === key ? cur : null);
    overlay.style.display = 'flex';
    requestAnimationFrame(() => overlay.classList.add('scenario-overlay-open'));

    const closeBtn = document.getElementById(`${idPrefix}ScenarioClose`);
    closeBtn.addEventListener('click', () => closeOverlay());

    const extraChoice = document.getElementById(`${idPrefix}ScenarioExtraChoice`);
    if (extraChoice) {
      extraChoice.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          extraChoice.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          const explainBox = document.getElementById(`${idPrefix}ScenarioExtraExplain`);
          if (explainBox) {
            explainBox.querySelectorAll('.severity-explain-row').forEach(row => {
              row.classList.toggle('active', row.dataset.explainFor === chip.dataset.extraValue);
            });
          }
        });
      });
    }

    document.getElementById(`${idPrefix}ScenarioConfirm`).addEventListener('click', () => {
      const sc = MARKET_SCENARIOS[key];
      const newConfig = {
        key,
        baseSupply: (() => { const el = document.getElementById(`${idPrefix}ScenarioSupply`); return el ? (Number(el.value) || sc.baseSupply) : sc.baseSupply; })(),
        baseDemand: Number(document.getElementById(`${idPrefix}ScenarioDemand`).value) || sc.baseDemand,
      };
      if (sc.extra) {
        if (sc.extra.type === 'select') {
          const active = extraChoice.querySelector('.chip.active');
          newConfig[sc.extra.key] = active ? active.dataset.extraValue : sc.extra.default;
        } else {
          newConfig[sc.extra.key] = Number(document.getElementById(`${idPrefix}ScenarioExtra`).value) || sc.extra.default;
        }
      }
      if (sc.price != null) newConfig.price = sc.price;
      setConfig(newConfig);
      closeOverlay();
      refreshIconBoxes();
    });
  };
  const closeOverlay = () => {
    const overlay = document.getElementById(`${idPrefix}ScenarioOverlay`);
    overlay.classList.remove('scenario-overlay-open');
    setTimeout(() => { overlay.style.display = 'none'; overlay.innerHTML = ''; }, 180);
  };
  const refreshIconBoxes = () => {
    const cfg = getConfig();
    document.querySelectorAll(`#${idPrefix}ScenarioIcons .scenario-icon-box`).forEach(box => {
      const isSel = box.dataset.scenario === cfg.key;
      box.classList.toggle('active', isSel);
      const existingBadge = box.querySelector('.scenario-icon-selected');
      if (isSel && !existingBadge) {
        const b = document.createElement('span');
        b.className = 'badge badge-ok scenario-icon-selected';
        b.textContent = 'Selected';
        box.appendChild(b);
      } else if (!isSel && existingBadge) {
        existingBadge.remove();
      }
    });
    const summary = document.getElementById(`${idPrefix}ScenarioSummary`);
    if (summary) summary.textContent = scenarioSummaryText(cfg);
  };
  document.querySelectorAll(`#${idPrefix}ScenarioIcons .scenario-icon-box`).forEach(box => {
    box.addEventListener('click', () => openOverlay(box.dataset.scenario));
  });
}

function initMarketChart(idPrefix) {
  if (!SHOW_MARKET_CHART) return; // hidden per current requirements; skip the fetch entirely, nothing to draw it into
  const statusEl = document.getElementById(`${idPrefix}MarketStatus`);
  loadMarketData().then((data) => {
    renderMarketChart(`${idPrefix}MarketCanvas`);
    if (!statusEl) return;
    const trendArrow = data.trendPct > 0.5 ? '▲' : data.trendPct < -0.5 ? '▼' : '→';
    const trendText = `${trendArrow} ${data.trendPct >= 0 ? '+' : ''}${data.trendPct.toFixed(1)}% over the shown period`;
    if (data.isLive) {
      statusEl.textContent = `🟢 Live data from Alpha Vantage: ${trendText}`;
    } else if (data.error) {
      // a key IS configured, but the live call didn't succeed. Say so accurately
      statusEl.textContent = `🟡 Simulated, live fetch failed (see below): ${trendText}`;
      statusEl.title = data.error;
      const detail = document.createElement('div');
      detail.className = 'hint';
      detail.style.color = 'var(--red)';
      detail.textContent = data.error;
      statusEl.after(detail);
    } else {
      statusEl.textContent = `🟡 Simulated (no API key configured): ${trendText}`;
    }
  });
}

// ---------- mm:ss TIMER PARSING (max 5:00 per round) ----------
const MAX_TIMER_SECONDS = 300; // 5 minutes
function parseMmSs(str) {
  const m = String(str || '').trim().match(/^(\d{1,2}):([0-5]\d)$/);
  if (!m) return 0;
  const total = Number(m[1]) * 60 + Number(m[2]);
  return Math.max(0, Math.min(MAX_TIMER_SECONDS, total));
}
function formatMmSs(totalSeconds) {
  const s = Math.max(0, Math.min(MAX_TIMER_SECONDS, Math.round(totalSeconds || 0)));
  const mm = Math.floor(s / 60), ss = s % 60;
  return String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}
function clampInt(value, min, max, fallback) {
  const n = Math.round(Number(value));
  if (!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, n));
}

function getMyRoleState() {
  if (state.mode === 'multiplayer' && state.localRole === 'facilitator') {
    // The Facilitator oversees the whole room, not one team; week/totalWeeks
    // are identical across every team's engine since they share one session,
    // so team 0 is a safe reference for that shared info.
    const game = state.teams ? state.teams[0] : null;
    if (!game) return null;
    return { week: game.week, totalWeeks: game.totalWeeks, isFixedOrderWeek: game.isFixedOrderWeek(game.week) };
  }
  const game = state.mode === 'solo' ? state.game : (state.teams ? state.teams[state.localTeamIndex] : null);
  if (!game || !state.localRole) return null;
  return game.getVisibleStateFor(state.localRole);
}
// ---------- IN-PLAY WARNINGS: overordering & stockout ----------
// "Overordering" here means holding noticeably more stock than recent
// demand justifies, a visible sign that past orders ran ahead of what was
// actually needed. The multiplier and floor below are a deliberately
// simple, explainable heuristic, not a precise inventory-theory formula.
// ---------- AI ORDERING-MISTAKE DETECTION (Facilitator view) ----------
// Scans each chain role's completed weeks and flags ordering decisions
// that look like real mistakes, so the Facilitator can point to a
// specific week and number during the debrief rather than saying "someone
// overordered at some point".
//
// Every rule below compares a role's order against what that role could
// actually see at the time (their own incoming order, stock, and backlog).
// That matters: flagging someone for not reacting to information they were
// never shown would be unfair, and would also misrepresent the exercise,
// where acting on incomplete information is the whole point.
//
// Severity is 'high' for decisions that are clearly costly, 'medium' for
// ones worth discussing. Nothing here is presented as an automatic
// judgment, it's a prompt for the Facilitator to look closer.
const MISTAKE_RULES = {
  // Ordered far more than the demand actually placed on them, while already
  // holding plenty of stock. This is the classic bullwhip overreaction.
  overorder: {
    label: 'Overordered',
    severity: 'high',
    check: (h, prev) => {
      if (h.week <= FIXED_ORDER_WEEKS) return null;
      const demand = h.incomingOrder;
      const threshold = Math.max(demand * 2.5, demand + 8);
      if (h.orderPlaced > threshold && h.stock > demand * 2) {
        return `ordered ${h.orderPlaced} against demand of ${demand} while already holding ${h.stock} in stock`;
      }
      return null;
    },
  },
  // Sitting on real backlog but ordering at or below the incoming demand,
  // which mathematically cannot clear the shortfall.
  underorderWithBacklog: {
    label: 'Underordered while behind',
    severity: 'high',
    check: (h, prev) => {
      if (h.week <= FIXED_ORDER_WEEKS) return null;
      if (h.backlog >= 5 && h.orderPlaced <= h.incomingOrder) {
        return `ordered only ${h.orderPlaced} while ${h.backlog} units behind, which can't clear the backlog`;
      }
      return null;
    },
  },
  // Huge week-over-week swing in their own order, out of proportion to any
  // change in the demand they actually saw. Panic-ordering.
  wildSwing: {
    label: 'Erratic swing',
    severity: 'medium',
    check: (h, prev) => {
      if (!prev || h.week <= FIXED_ORDER_WEEKS + 1) return null;
      const orderSwing = Math.abs(h.orderPlaced - prev.orderPlaced);
      const demandSwing = Math.abs(h.incomingOrder - prev.incomingOrder);
      if (orderSwing >= 10 && orderSwing > demandSwing * 3) {
        return `swung their order from ${prev.orderPlaced} to ${h.orderPlaced} while demand only moved from ${prev.incomingOrder} to ${h.incomingOrder}`;
      }
      return null;
    },
  },
  // Ordered nothing at all while demand was clearly ongoing.
  orderedNothing: {
    label: 'Ordered nothing',
    severity: 'medium',
    check: (h, prev) => {
      if (h.week <= FIXED_ORDER_WEEKS) return null;
      if (h.orderPlaced === 0 && h.incomingOrder > 0 && h.stock < h.incomingOrder * 2) {

      }
      return null;
    },
  },
  // Kept piling on stock they clearly didn't need for several weeks running.
  sustainedExcess: {
    label: 'Sustained excess stock',
    severity: 'medium',
    check: (h, prev, history) => {
      if (h.week <= FIXED_ORDER_WEEKS + 2) return null;
      const idx = history.indexOf(h);
      const window = history.slice(Math.max(0, idx - 2), idx + 1);
      if (window.length < 3) return null;
      const allExcess = window.every(x => x.stock > Math.max(20, x.incomingOrder * 3));

      }

  },

// Returns a flat, newest-first list of detected mistakes across all 4
// chain roles for a given game.
function detectOrderingMistakes(game) {
  if (!game) return [];
  const found = [];
  CHAIN.forEach(role => {
    const history = game.roles[role].history;
    history.forEach((h, i) => {
      const prev = i > 0 ? history[i - 1] : null;
      Object.entries(MISTAKE_RULES).forEach(([key, rule]) => {
        const detail = rule.check(h, prev, history);
        if (detail) {
          found.push({ role, week: h.week, label: rule.label, severity: rule.severity, detail });
        }
      });
    });
  });
  // newest first, so the most recent problems are the first thing seen
  return found.sort((a, b) => b.week - a.week);
}

function renderMistakePanel(game) {

    <p class="hint">Automatic scan of every completed week for ordering decisions worth discussing. These are prompts for you to look closer, not automatic judgments: each one compares a role's order against what that role could actually see at the time.</p>
    ${mistakes.length === 0
      ? `<p class="hint">No ordering problems detected so far. This updates as more weeks complete.</p>`

}

function computeStockWarning(o) {

// ---------- SOUND SYSTEM ----------

// embedded audio files - keeps this a single self-contained file with no
// external or licensed audio assets, same principle as sourcing the market
// chart and news content from curated/generated data rather than a live

// Background music: a slow, quiet, looping pentatonic pad, not a melody

// "global news" framing discussed in the meeting), which they can accept

// drift below is a reasonable, documented judgment call (the meeting didn't

// Supply Shock pulls it down by the chosen severity, Efficient Chain trends
// it gently upward as costs fall, Stable Market just adds mild week-to-week
// noise around the base value.
function computeSuggestedDemand(week) {
  const config = getActiveScenarioConfig();
  const sc = MARKET_SCENARIOS[config.key];

  const weeksIntoPlay = Math.max(0, week - FIXED_ORDER_WEEKS);

  let s = `Ordered <b>${entry.placed}</b>`;
  const bits = [];
  if (!entry.ai && entry.typed != null) {
    bits.push(`typed ${entry.typed}`);
    if (entry.news) bits.push(`news ${entry.news > 0 ? '+' : ''}${entry.news}`);
  }
  if (entry.capped != null) bits.push(`capped at ${entry.capped}`);
  if (bits.length && (entry.capped != null || (!entry.ai && entry.typed !== entry.placed))) s += ` <span class="hint">(${bits.join(', ')})</span>`;
  return s;
}

// ---------- FACILITATOR INTERVENTIONS ----------
// Three levers for a Facilitator when one role is stuck in a spiral (a Retailer
// that understocks, then panic-orders to clear the backlog and floods everyone
// upstream). All are off until the Facilitator switches them on, and every
// player is told on screen when one applies to them. The rules themselves live
// in the engine (setInterventions); this is just the controls and the display.
//   1. Information sharing: the Retailer's stock, backlog and real customer
//      demand are shown to the Wholesaler (or the whole chain), and AI seats in
//      that scope order from real customer demand.
//   2. Order ceiling: a cap on one role's order for a number of weeks.
//   3. Market shift: different holding and/or backlog cost for one role or all.
// Rates can be cents (a $0.50 backlog cost), which fmtDollar would round to a whole dollar.
function fmtRate(n) {
  const v = Math.round(Number(n) * 100) / 100;
  return '$' + (Number.isInteger(v) ? v : v.toFixed(2));
}
function getInterventions() {
  const g = state.mode === 'solo' ? state.game : (state.teams && state.teams[0]);
  return (g && g.interventions) || { infoScope: 'off', caps: {}, costs: {} };
}
function currentSessionWeek() {
  const g = state.mode === 'solo' ? state.game : (state.teams && state.teams[0]);
  return g ? g.week : 1;
}
function cloneInterventions() { return JSON.parse(JSON.stringify(getInterventions())); }
function applyInterventionsToAll(iv) {
  const games = state.mode === 'solo' ? [state.game] : (state.teams || []);
  games.forEach(g => { if (g && g.setInterventions) g.setInterventions(iv); });
}
function applyInterventionsAsHost(next) {
  applyInterventionsToAll(next);
  // a ceiling or a cost change moves what a role will place, so refresh what is on show
  state.incomingOrders = computeIncomingOrdersAsHost();
  state.submittedOrders = computeSubmittedOrdersAsHost();
  state.transport.send({ type: 'intervention_update', interventions: getInterventions(), incomingOrders: state.incomingOrders, submittedOrders: state.submittedOrders });
}
function requestInterventions(next) {
  if (state.mode === 'multiplayer') {
    if (state.multiplayerRole === 'host') applyInterventionsAsHost(next);
    else state.transport.send({ type: 'intervention_request', tempId: state.joinTempId, interventions: next });
  } else {
    applyInterventionsToAll(next);
  }
  render();
}
function anyCostShiftApplied() {
  const games = state.mode === 'solo' ? [state.game] : (state.teams || []);
  return games.some(g => g && g.weekHistory && g.weekHistory.some(w => w.costOverrides));
}

// What a player sees about interventions that apply to them.
function renderInterventionNotices(role, game) {
  if (!game || !game.interventions) return '';
  const iv = game.interventions; const week = game.week; let out = '';
  const cap = game.orderCapFor(role, week);
  if (cap != null) {
    const left = iv.caps[role].untilWeek - week + 1;
    out += `<div class="iv-notice iv-cap">🚧 <b>Facilitator order ceiling:</b> you can order at most <b>${cap}</b> units a week, for ${left} more week${left === 1 ? '' : 's'} including this one. Anything higher is cut down to ${cap}.</div>`;
  }
  if (game.hasCostOverride(role)) {
    const r = game.costRatesFor(role);
    out += `<div class="iv-notice iv-cost">💱 <b>Market shift:</b> your costs are now ${fmtRate(r.holding)} per unit of stock and ${fmtRate(r.stockout)} per unit of backlog, each week.</div>`;
  }
  if (role === 'retailer' && iv.infoScope !== 'off') {
    out += `<div class="iv-notice iv-info">📡 The Facilitator is sharing your stock, backlog and customer demand with the ${iv.infoScope === 'chain' ? 'whole chain' : 'Wholesaler'}.</div>`;
  }
  if (role !== 'retailer' && game.infoSharedWith(role)) out += renderSharedRetailerData(game);
  return out;
}
function renderSharedRetailerData(game) {
  const r = game.roles.retailer;
  const customers = getRevealedIncomingFor('retailer');
  const rows = game.weekHistory.slice(-6).map(w => `<tr><td>${w.week}</td><td>${w.consumerDemand}</td><td>${w.roles.retailer.orderPlaced}</td></tr>`).join('');
  return `<div class="iv-notice iv-info shared-card">
    <b>📡 Shared by the Retailer</b>
    <div class="shared-figures"><span>Stock <b>${r.stock}</b></span><span>Backlog <b class="${r.backlog > 0 ? 'neg' : ''}">${r.backlog}</b></span><span>Customers ordered this week <b>${customers != null ? customers : '--'}</b></span></div>
    ${rows ? `<table class="mini-table"><thead><tr><th>Week</th><th>Customers ordered</th><th>Retailer ordered</th></tr></thead><tbody>${rows}</tbody></table>` : ''}
    <div class="hint">The real customer demand is the number to plan around. A Retailer clearing a backlog can order far more than customers actually want.</div>
  </div>`;
}

// The Facilitator's controls.
function renderInterventionsPanel() {
  const iv = getInterventions(); const week = currentSessionWeek(); const d = state.ivDraft;
  const roleOpts = (sel, withAll) => (withAll ? `<option value="all" ${sel === 'all' ? 'selected' : ''}>All four roles</option>` : '') + CHAIN.map(r => `<option value="${r}" ${sel === r ? 'selected' : ''}>${ROLE_ICON[r]} ${ROLE_LABELS[r]}</option>`).join('');
  const caps = Object.keys(iv.caps).filter(r => week <= iv.caps[r].untilWeek);
  const costKeys = Object.keys(iv.costs);
  const game = state.mode === 'solo' ? state.game : (state.teams && state.teams[0]);
  const warn = [];
  costKeys.forEach(k => {
    const targets = k === 'all' ? CHAIN : [k];
    targets.forEach(r => { const x = game ? game.costRatesFor(r) : null; if (x && x.stockout < x.holding && !warn.includes(r)) warn.push(r); });
  });
  const costLabel = k => (k === 'all' ? 'All roles' : `${ROLE_ICON[k]} ${ROLE_LABELS[k]}`) + ': ' + [iv.costs[k].holding != null ? `stock ${fmtRate(iv.costs[k].holding)}` : null, iv.costs[k].stockout != null ? `backlog ${fmtRate(iv.costs[k].stockout)}` : null].filter(Boolean).join(', ') + ' per unit per week';
  return `
  <div class="panel iv-panel" style="margin-top:18px;">
    <div class="card">
      <h3>🧰 Facilitator Interventions</h3>
      <p class="hint">For when one role is stuck in a backlog spiral and is dragging everyone upstream with it. Each one is off until you switch it on, and the players affected are told on their screens.</p>
      ${state.ivError ? `<div class="warning-banner warning-banner-amber">${state.ivError}</div>` : ''}
      <div class="iv-grid">
        <div class="iv-box">
          <h4>📡 Information sharing</h4>
          <select id="ivInfoScope" class="news-select">
            <option value="off" ${iv.infoScope === 'off' ? 'selected' : ''}>Off</option>
            <option value="wholesaler" ${iv.infoScope === 'wholesaler' ? 'selected' : ''}>Retailer → Wholesaler</option>
            <option value="chain" ${iv.infoScope === 'chain' ? 'selected' : ''}>Retailer → whole chain</option>
          </select>
          <p class="hint">Shows the Retailer's stock, backlog and the real customer demand. AI seats in scope then order from real customer demand instead of the order their buyer placed. This breaks the normal rule that you only see your own numbers.</p>
        </div>
        <div class="iv-box">
          <h4>🚧 Order ceiling</h4>
          <div class="iv-row"><select id="ivCapRole" class="news-select">${roleOpts(d.ivCapRole, false)}</select></div>
          <div class="iv-row"><label>Max units a week <input type="number" min="0" id="ivCapMax" value="${d.ivCapMax}" /></label><label>For how many weeks <input type="number" min="1" id="ivCapRounds" value="${d.ivCapRounds}" /></label></div>
          <div class="iv-row"><button class="btn-secondary" id="ivCapApply" type="button">Set ceiling</button><button class="btn-secondary" id="ivCapClear" type="button">Remove for this role</button></div>
          ${caps.length ? `<ul class="iv-active">${caps.map(r => `<li>${ROLE_ICON[r]} ${ROLE_LABELS[r]}: at most <b>${iv.caps[r].max}</b> a week, through week ${iv.caps[r].untilWeek} (${iv.caps[r].untilWeek - week + 1} left)</li>`).join('')}</ul>` : '<p class="hint">No ceiling active. Counts from the current week, so 3 weeks covers this week and the next two.</p>'}
        </div>
        <div class="iv-box">
          <h4>💱 Market shift</h4>
          <div class="iv-row"><select id="ivCostRole" class="news-select">${roleOpts(d.ivCostRole, true)}</select></div>
          <div class="iv-row"><label>Stock $/unit/week <input type="number" min="0" step="0.25" id="ivCostHolding" value="${d.ivCostHolding}" placeholder="unchanged" /></label><label>Backlog $/unit/week <input type="number" min="0" step="0.25" id="ivCostStockout" value="${d.ivCostStockout}" placeholder="unchanged" /></label></div>
          <div class="iv-row"><button class="btn-secondary" id="ivCostApply" type="button">Apply from next week resolved</button><button class="btn-secondary" id="ivCostReset" type="button">Reset this one</button></div>
          ${costKeys.length ? `<ul class="iv-active">${costKeys.map(k => `<li>${costLabel(k)}</li>`).join('')}</ul>` : '<p class="hint">No cost change active. Weeks already played are never recalculated.</p>'}
          ${warn.length ? `<div class="warning-banner warning-banner-amber">⚠ For ${warn.map(r => ROLE_LABELS[r]).join(', ')}, backlog now costs less than holding stock, so running short is the cheaper strategy. Raise the backlog cost to discourage understocking; lower it only to calm a panic-ordering role.</div>` : ''}
        </div>
      </div>
      <button class="btn-secondary" id="ivClearAll" type="button" style="margin-top:12px;">Clear every intervention</button>
    </div>
  </div>`;
}
function bindInterventionEvents() {
  const $ = id => document.getElementById(id);
  const d = state.ivDraft;
  ['ivCapRole', 'ivCapMax', 'ivCapRounds', 'ivCostRole', 'ivCostHolding', 'ivCostStockout'].forEach(id => {
    const el = $(id); if (!el) return;
    el.addEventListener('input', () => { d[id] = el.value; });
    el.addEventListener('change', () => { d[id] = el.value; });
  });
  const fail = msg => { state.ivError = msg; render(); };
  const info = $('ivInfoScope');
  if (info) info.addEventListener('change', () => { const next = cloneInterventions(); next.infoScope = info.value; state.ivError = null; requestInterventions(next); });
  const capApply = $('ivCapApply');
  if (capApply) capApply.addEventListener('click', () => {
    const max = Number($('ivCapMax').value), rounds = Math.round(Number($('ivCapRounds').value));
    if ($('ivCapMax').value === '' || !isFinite(max) || max < 0 || !(rounds >= 1)) return fail('Enter a ceiling of 0 or more, and at least 1 week.');
    const next = cloneInterventions(); next.caps[$('ivCapRole').value] = { max: Math.round(max), untilWeek: currentSessionWeek() + rounds - 1 };
    state.ivError = null; requestInterventions(next);
  });
  const capClear = $('ivCapClear');
  if (capClear) capClear.addEventListener('click', () => { const next = cloneInterventions(); delete next.caps[$('ivCapRole').value]; state.ivError = null; requestInterventions(next); });
  const costApply = $('ivCostApply');
  if (costApply) costApply.addEventListener('click', () => {
    const h = $('ivCostHolding').value, s = $('ivCostStockout').value;
    const bad = v => v !== '' && (!isFinite(Number(v)) || Number(v) < 0);
    if ((h === '' && s === '') || bad(h) || bad(s)) return fail('Enter a stock cost, a backlog cost, or both (0 or more).');
    const next = cloneInterventions(); const entry = {};
    if (h !== '') entry.holding = Number(h);
    if (s !== '') entry.stockout = Number(s);
    next.costs[$('ivCostRole').value] = entry; state.ivError = null; requestInterventions(next);
  });
  const costReset = $('ivCostReset');
  if (costReset) costReset.addEventListener('click', () => { const next = cloneInterventions(); delete next.costs[$('ivCostRole').value]; state.ivError = null; requestInterventions(next); });
  const clearAll = $('ivClearAll');
  if (clearAll) clearAll.addEventListener('click', () => { state.ivError = null; requestInterventions({ infoScope: 'off', caps: {}, costs: {} }); });
}

function render() {
  renderSettingsPanel();
  const app = document.getElementById('app');
  if (state.screen === 'start') { app.innerHTML = renderStart(); bindStartEvents(); return; }
  if (state.screen === 'modeSelect') { app.innerHTML = renderModeSelect(); bindModeSelectEvents(); return; }
  if (state.screen === 'soloSetup') { app.innerHTML = renderSoloSetup(); bindSoloSetupEvents(); return; }
  if (state.screen === 'mpEntry') { app.innerHTML = renderMpEntry(); bindMpEntryEvents(); return; }
  if (state.screen === 'mpHostSetup') { app.innerHTML = renderMpHostSetup(); bindMpHostSetupEvents(); return; }
  if (state.screen === 'mpJoin') { app.innerHTML = renderMpJoin(); bindMpJoinEvents(); return; }
  if (state.screen === 'mpLobby') { app.innerHTML = renderMpLobby(); bindMpLobbyEvents(); return; }
  if (state.screen === 'end') { app.innerHTML = renderEnd(); bindEndEvents(); drawEndBarChart(); return; }
  app.innerHTML = renderPlay();
  bindPlayEvents();
  updateTimerDisplay();
}
